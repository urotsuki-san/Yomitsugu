name: Installed input E2E

on:
  workflow_call:
    inputs:
      artifact_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Windows workflow run containing the installer
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  installed-input:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download tested installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          if ($env:ARTIFACT_RUN -notmatch '^[0-9]+$') { throw 'Invalid run ID' }
          gh run download $env:ARTIFACT_RUN --name yomitsugu-0.2.10-preview-installer --dir audit/ci-installer
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
      - name: Build input and update test drivers
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
          cmake --build native/build --config Release --target e2e_tip_tests app_update_test
          if ($LASTEXITCODE -ne 0) { throw 'Driver build failed' }
      - name: Install through updater and run input E2E
        shell: pwsh
        run: scripts/ci/run_installed_e2e.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-input-e2e-results
          path: |
            audit/installed-e2e/*.log
            audit/installed-e2e/*.err
            audit/installed-e2e/*.json
          if-no-files-found: error
          retention-days: 14

  chrome:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          name: yomitsugu-0.2.10-preview-installer
          path: audit/download
      - name: Prepare the installer and profile selector
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem audit/download -Recurse -File -Filter 'Yomitsugu-0.2.10-preview-x64-setup.exe')
          if ($setups.Count -ne 1) { throw 'Expected one Windows installer' }
          New-Item -ItemType Directory -Path audit/ci-installer | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName -Destination audit/ci-installer
          cmake -S native -B build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --target chrome_select_profile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test the installed IME in Chrome search and text fields
        shell: pwsh
        run: ./scripts/ci/chrome/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-input-result
          path: audit/chrome
          retention-days: 7
