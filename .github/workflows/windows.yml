name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Python regression
        shell: pwsh
        run: |
          uv run pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }
          uv run python -c "from ime_mixed.evaluate import evaluate_seed_file; s=evaluate_seed_file('ime_acceptance_seed_cases.jsonl')['summary']; print(s); assert s['failed']==0"
          if ($LASTEXITCODE -ne 0) { throw 'acceptance seed failed' }
      - name: Build native source
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build native/build --config Release --target tip_stability_test learning_test app_update_test engine_test debug_dump ime_mixed_tip ime_engine_host e2e_tip_tests tip_com_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          & native/build/Release/learning_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Learning cache test failed' }
          & native/build/Release/tip_stability_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'TIP stability test failed' }
      - name: Dictionary update history
        shell: pwsh
        run: scripts/ci/test_dictionary_update.ps1
  installer-preview:
    if: github.event_name != 'pull_request'
    needs: source-checks
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          key: windows-2022-runtime-v1-${{ hashFiles('scripts/ci/prepare_runtime.ps1', 'patches/*.patch') }}
          path: |
            upstream/myime/build/x64/release
            upstream/myime/LICENSE
            upstream/myime/llama.cpp-src/LICENSE
            upstream/myime/src/AzooKeyKanaKanjiConverter/LICENSE
            upstream/myime/src/AzooKeyKanaKanjiConverter/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_dictionary_storage/LICENSE
            upstream/myime/src/AzooKeyKanaKanjiConverter/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_emoji_dictionary_storage/README.md
            upstream/myime/src/AzooKeyKanaKanjiConverter/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_emoji_dictionary_storage/data/README.md
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          swift-version: "6.3.3"
      - name: Prepare pinned conversion runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/ci/prepare_runtime.ps1
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          key: windows-2022-runtime-v1-${{ hashFiles('scripts/ci/prepare_runtime.ps1', 'patches/*.patch') }}
          path: |
            upstream/myime/build/x64/release
            upstream/myime/LICENSE
            upstream/myime/llama.cpp-src/LICENSE
            upstream/myime/src/AzooKeyKanaKanjiConverter/LICENSE
            upstream/myime/src/AzooKeyKanaKanjiConverter/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_dictionary_storage/LICENSE
            upstream/myime/src/AzooKeyKanaKanjiConverter/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_emoji_dictionary_storage/README.md
            upstream/myime/src/AzooKeyKanaKanjiConverter/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_emoji_dictionary_storage/data/README.md
      - name: Build and test full engine
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build native/build --config Release --target app_update_test engine_test debug_dump quality_typo_long release_test ime_mixed_tip ime_engine_host ime_dictionary_tool ime_settings ime_tray ime_profile_control e2e_tip_tests tip_com_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          & scripts/stage_engine.ps1 -Destination native/build/e2e_out_v14/engine
          & scripts/ci/stage_test_runtime.ps1
          & native/build/Release/app_update_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'app_update_test failed' }
          & native/build/Release/engine_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'engine_test failed' }
          & native/build/Release/quality_typo_long.exe
          if ($LASTEXITCODE -ne 0) { throw 'quality_typo_long failed' }
          & native/build/Release/release_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'release_test failed' }
          python scripts/ci/engine_stability.py native/build/Release/ime_engine_host.exe
          if ($LASTEXITCODE -ne 0) { throw 'Engine stability failed' }
          python scripts/ci/model_boundary.py native/build/Release/debug_dump.exe
          if ($LASTEXITCODE -ne 0) { throw 'Model capacity boundary failed' }
          python scripts/evaluate_conversion.py --output audit/conversion-quality.json --check --baseline native/tests/conversion_baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'conversion quality regression' }
          python scripts/ci/context_quality.py native/build/Release/ime_engine_host.exe tests/context_conversion.json audit/context-quality.json --check
          if ($LASTEXITCODE -ne 0) { throw 'context conversion regression' }
          python scripts/ci/context_quality.py native/build/Release/ime_engine_host.exe tests/generated_typo_conversion.json audit/generated-typo-quality.json --baseline native/tests/generated_typo_baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'generated typo regression' }
          python scripts/ci/typing_latency.py native/build/Release/ime_engine_host.exe audit/typing-latency.json
          if ($LASTEXITCODE -ne 0) { throw 'typing phase regression' }
          & scripts/capture_engine_demo.ps1
          & native/build/e2e_out_v14/tip_com_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'TIP COM smoke failed' }
      - name: Create validated package
        shell: pwsh
        run: |
          & scripts/package_release.ps1
          & scripts/validate_package.ps1
          & scripts/archive_release.ps1
          python scripts/verify_archive.py
          if ($LASTEXITCODE -ne 0) { throw 'Archive verification failed' }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build installer
        shell: pwsh
        run: scripts/build_installer.ps1
      - name: Smoke test installation and removal
        shell: pwsh
        run: scripts/ci/smoke_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: yomitsugu-0.2.10-preview-installer
          path: |
            dist/installer/Yomitsugu-0.2.10-preview-x64-setup.exe
            dist/yomitsugu-0.2.10-preview.zip.sha256
            audit/conversion-quality.json
            audit/context-quality.json
            audit/generated-typo-quality.json
            audit/typing-latency.json
          retention-days: 7
          if-no-files-found: error
