[project]
name = "ime-mixed"
version = "0.1.0"
description = "Headless mixed English-Japanese decoder acceptance CLI (Stage 1)"
readme = "windows_modeless_ai_ime_design_v2_google_ux_ja.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ime-mixed = "ime_mixed.cli:main"
ime-sim = "ime_mixed.simulate:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ime_mixed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
